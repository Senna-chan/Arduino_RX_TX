; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[Arduino_TX_HAL_E]
platform = ststm32
board = black_f407ve
framework = stm32cube

build_type = debug

extra_scripts = pre:setup_cubemx_env_auto.py
platform_packages = toolchain-gccarmnoneeabi@1.140201.0

upload_protocol = custom
upload_command = openocd -s $PROJECT_PACKAGES_DIR/tool-openocd/scripts -f interface/stlink.cfg -c "transport select hla_swd" $UPLOAD_FLAGS -c "program {$SOURCE} 0x08000000 verify reset; shutdown;"
upload_flags =
    -c
    hla_serial 0035001E3331510F34333834
    -f
    target/stm32f4x.cfg

debug_tool = stlink
debug_extra_cmds =
    source stl-views.gdb

lib_ldf_mode = chain+
lib_compat_mode = off
lib_deps =
    FreeRTOS
    STLinkedResources
    ArduinoBackport
    HardwareSerial
    I2CEncoder
    SharedCode
    SharedIndependantCode
    channelfunctions
    SerialControlLibrary
    PlotterLib
    CompanionControl

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_STANDARD_LIB
    -DDEBUG
    -DMALLOCS_INSIDE_ISRs  ; Allow Malloc in interrups(CURSED?)
    -std=gnu++23
    -O0 -ggdb3
    -Ilib/FreeRTOS/include
    -Ilib/FreeRTOS/portable/GCC/ARM_CM4F
    -fno-omit-frame-pointer


monitor_port = /dev/ttyACM1
monitor_speed = 115200

[env:Arduino_TX_HAL]
extends = Arduino_TX_HAL_E
build_flags =
    ${Arduino_TX_HAL_E.build_flags}
    -DRUNCODE

[env:UnitTests]
extends = Arduino_TX_HAL_E
build_flags =
    ${Arduino_TX_HAL_E.build_flags}
    -DUNITTEST