; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Arduino_RX]
platform = ststm32
board = black_f407ve
framework = stm32cube
platform_packages = toolchain-gccarmnoneeabi@1.120301.0
board_build.stm32cube.custom_config_header = yes
build_type = debug

upload_protocol = custom
upload_command = openocd -s $PROJECT_PACKAGES_DIR/tool-openocd/scripts -f interface/stlink.cfg -c "transport select hla_swd" $UPLOAD_FLAGS -c "program {$SOURCE} 0x08000000 verify reset; shutdown;"
upload_flags =
    -c
    adapter serial 50FF6E067085495117352487
    -f
    target/stm32f4x.cfg

debug_tool = stlink

build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_STANDARD_LIB

lib_ldf_mode = chain+
lib_compat_mode = off
lib_deps =
    nrf24l01
    SBUS
    SharedCode
    w25qxx

[platformio]
include_dir = Inc
src_dir = Src
